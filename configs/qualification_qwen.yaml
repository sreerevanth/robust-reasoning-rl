# Same fixed validation questions and decoding as SmolLM qualification.
seed: 42
output_dir: results/qualification-qwen
dataset: {source: local, path: data/gsm8k_phase2_validation.jsonl, limit: 16}
model:
  backend: huggingface
  name: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  prompt_format: chat
  device: cpu
  cpu_threads: 4
generation: {num_generations: 1, temperature: 0, top_p: 0.95, max_tokens: 512}
evaluation: {k: [1]}
training_verifier:
  strategy: mean
  members: [{kind: rule}, {kind: rule}, {kind: rule}]
evaluation_verifier: {kind: rule}
